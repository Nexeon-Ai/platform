# Huly (Arabic + RTL) — Coolify deployment
#
# Uses the Arabic images published to GHCR by .github/workflows/build-arabic-images.yml
# (ghcr.io/<owner>/huly-*). Set the variables in coolify/.env.example via Coolify's
# Environment Variables editor. Assign your domain to the `nginx` service in Coolify
# (Domains → https://<your-domain> → port 80); Coolify terminates TLS and proxies to it.
#
# Public images (cockroach, redpanda, minio, elastic, nginx) are pulled as-is.

services:
  nginx:
    image: 'nginx:1.21.3'
    # Coolify: assign your domain to this service (port 80). This magic var lets
    # Coolify wire Traefik + TLS automatically; HOST_ADDRESS below must match it.
    environment:
      - SERVICE_FQDN_NGINX_80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - account
      - transactor
      - collaborator
      - stats
      - rekoni
    restart: unless-stopped

  cockroach:
    image: cockroachdb/cockroach:latest-v24.2
    command: start-single-node --accept-sql-without-tls
    environment:
      - COCKROACH_DATABASE=${CR_DATABASE:-defaultdb}
      - COCKROACH_USER=${CR_USERNAME:-root}
      - COCKROACH_PASSWORD=${CR_USER_PASSWORD:-}
    volumes:
      - cr_data:/cockroach/cockroach-data
      - cr_certs:/cockroach/certs
    healthcheck:
      test: ['CMD-SHELL', "cockroach sql --insecure --host=localhost:26257 -e 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.6
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'info']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: 'minio/minio'
    command: server /data --address ":9000" --console-address ":9001"
    volumes:
      - files:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10
    restart: unless-stopped

  elastic:
    image: 'elasticsearch:7.14.2'
    command: |
      /bin/sh -c "./bin/elasticsearch-plugin list | grep -q ingest-attachment || yes | ./bin/elasticsearch-plugin install --silent ingest-attachment;
      /usr/local/bin/docker-entrypoint.sh eswrapper"
    volumes:
      - elastic:/usr/share/elasticsearch/data
    environment:
      - ELASTICSEARCH_PORT_NUMBER=9200
      - BITNAMI_DEBUG=true
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1024m -Xmx1024m
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:8082
    healthcheck:
      interval: 20s
      retries: 10
      test: curl -s http://localhost:9200/_cluster/health | grep -vq '"status":"red"'
    restart: unless-stopped

  rekoni:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-rekoni:${HULY_IMAGE_TAG:-ar}
    environment:
      - SECRET=${SECRET}
    deploy:
      resources:
        limits:
          memory: 500M
    restart: unless-stopped

  transactor:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-transactor:${HULY_IMAGE_TAG:-ar}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - SERVER_PORT=3333
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http://front:8080
      - ACCOUNTS_URL=http://account:3000
      - FULLTEXT_URL=http://fulltext:4700
      - STATS_URL=http://stats:4900
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped

  collaborator:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-collaborator:${HULY_IMAGE_TAG:-ar}
    depends_on:
      minio:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      - COLLABORATOR_PORT=3078
      - SECRET=${SECRET}
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
    restart: unless-stopped

  account:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-account:${HULY_IMAGE_TAG:-ar}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - SERVER_PORT=3000
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - FRONT_URL=http${SECURE:+s}://${HOST_ADDRESS}
      - STATS_URL=http://stats:4900
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNT_PORT=3000
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped

  workspace:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-workspace:${HULY_IMAGE_TAG:-ar}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      account:
        condition: service_started
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - TRANSACTOR_URL=ws://transactor:3333;ws${SECURE:+s}://${HOST_ADDRESS}/_transactor
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - MODEL_ENABLED=*
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
      - ACCOUNTS_DB_URL=${CR_DB_URL}
    restart: unless-stopped

  fulltext:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-fulltext:${HULY_IMAGE_TAG:-ar}
    depends_on:
      cockroach:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      elastic:
        condition: service_healthy
      rekoni:
        condition: service_started
    environment:
      - SERVER_SECRET=${SECRET}
      - DB_URL=${CR_DB_URL}
      - FULLTEXT_DB_URL=http://elastic:9200
      - ELASTIC_INDEX_NAME=huly_storage_index
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - REKONI_URL=http://rekoni:4004
      - ACCOUNTS_URL=http://account:3000
      - STATS_URL=http://stats:4900
      - QUEUE_CONFIG=redpanda:9092
    restart: unless-stopped

  stats:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-stats:${HULY_IMAGE_TAG:-ar}
    environment:
      - PORT=4900
      - SERVER_SECRET=${SECRET}
    restart: unless-stopped

  front:
    image: ${HULY_IMAGE_REGISTRY:-ghcr.io/nexeon-ai}/huly-front:${HULY_IMAGE_TAG:-ar}
    depends_on:
      account:
        condition: service_started
    environment:
      - SERVER_PORT=8080
      - SERVER_SECRET=${SECRET}
      - ACCOUNTS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_accounts
      - ACCOUNTS_URL_INTERNAL=http://account:3000
      - REKONI_URL=http${SECURE:+s}://${HOST_ADDRESS}/_rekoni
      - STATS_URL=http${SECURE:+s}://${HOST_ADDRESS}/_stats
      - UPLOAD_URL=/files
      - ELASTIC_URL=http://elastic:9200
      - COLLABORATOR_URL=ws${SECURE:+s}://${HOST_ADDRESS}/_collaborator
      - STORAGE_CONFIG=minio|minio?accessKey=minioadmin&secretKey=minioadmin
      - TITLE=${TITLE:-Huly}
      - DEFAULT_LANGUAGE=${DEFAULT_LANGUAGE:-ar}
      - LAST_NAME_FIRST=${LAST_NAME_FIRST:-true}
      - DISABLED_FEATURES=auto-translate,mailboxes
    restart: unless-stopped

volumes:
  cr_data:
  cr_certs:
  redpanda:
  files:
  elastic:
