name: Build & publish Arabic Huly images (GHCR)

# Builds the Huly images that contain the Arabic + RTL changes and publishes
# them to this fork's GitHub Container Registry (ghcr.io/<owner>/huly-*), so a
# self-host / Coolify deployment can pull them.
#
# Run it from the Actions tab ("Run workflow") after enabling Actions on the
# fork, or it runs automatically when source/lang files change on this branch.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Moving tag to publish (immutable ar-<sha> is always pushed too)'
        default: 'ar'
        required: false
  push:
    branches: [deploy/coolify]
    paths:
      - 'plugins/**'
      - 'packages/**'
      - 'pods/**'
      - 'services/**'
      - 'models/**'
      - 'dev/**'
      - '.github/workflows/build-arabic-images.yml'

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: '1'
  DOCKER_CLI_HINTS: 'false'
  # We build images, not run browsers — skip puppeteer/playwright browser
  # downloads during install (flaky over CI network and unneeded here).
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      # Reuse the repo's own disk-cleanup composite action (the monorepo build
      # plus several images needs more than the default runner free space).
      - name: Free disk space
        uses: ./.github/actions/free-disk-space

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Rush install
        run: node common/scripts/install-run-rush.js install

      # Build only the images the production self-host stack needs (front carries
      # the Arabic UI; the rest are built from the same commit for compatibility).
      - name: Build Docker images
        run: |
          node common/scripts/install-run-rush.js docker:build -p 20 \
            --to @hcengineering/prod \
            --to @hcengineering/pod-front \
            --to @hcengineering/pod-server \
            --to @hcengineering/pod-account \
            --to @hcengineering/pod-workspace \
            --to @hcengineering/pod-collaborator \
            --to @hcengineering/pod-fulltext \
            --to @hcengineering/pod-stats \
            --to @hcengineering/rekoni-service

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push to GHCR
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REG="ghcr.io/${OWNER}"
          SHA="${GITHUB_SHA::12}"
          MOVING="${{ github.event.inputs.tag || 'ar' }}"
          # local hardcoreeng image name : published huly-<name> suffix
          MAP="front:front transactor:transactor account:account workspace:workspace collaborator:collaborator fulltext:fulltext stats:stats rekoni-service:rekoni"
          for entry in $MAP; do
            src="hardcoreeng/${entry%%:*}"
            dst="${REG}/huly-${entry##*:}"
            for tag in "$MOVING" "ar-${SHA}"; do
              docker tag "${src}:latest" "${dst}:${tag}"
              docker push "${dst}:${tag}"
              echo "pushed ${dst}:${tag}"
            done
          done
          echo "----"
          echo "Published images under ${REG}/huly-* (tags: ${MOVING}, ar-${SHA})."
          echo "Set HULY_IMAGE_REGISTRY=${REG} and HULY_IMAGE_TAG=${MOVING} in your Coolify env."
